[project]
name = "agent-config-tools"
version = "0.1.0"
description = "Maintenance CLI for the agent-config repository"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1,<9",
  "pyyaml>=6,<7",
  "rich>=14,<15",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8,<9",
  "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
